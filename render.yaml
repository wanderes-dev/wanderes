# Render Blueprint (Phase 18 deploy prep, 2026-08-30) - declarative
# web + worker + Postgres + Redis, mirroring docker-compose.yml's local
# service split. Applied once via Render's "New Blueprint" flow (connects
# this repo); after that, each `git push` to the connected branch redeploys.
#
# Secrets (sync: false) are never set here - Render prompts for them once
# during the Blueprint creation flow and stores them only in its own
# dashboard, never in this file or source control.
#
# 2026-09-02: resource names renamed from travelagent-* to wanderes-* (the
# product's actual name, per the 2026-09-01 rebrand - these were the one
# place deliberately left un-renamed at the time, due to production risk).
# Per Render's own docs, the `name:` field is how Blueprint sync matches a
# declared resource to an already-provisioned one - changing it does NOT
# rename the existing travelagent-db/redis/web/worker resources in place,
# it makes Render provision brand NEW ones under the new names on the next
# sync, leaving the old ones orphaned (not auto-deleted) with all prior
# data. Confirmed and accepted deliberately (direct instruction, prior
# production data judged fine to lose - a fresh Blueprint apply on the new
# names, then a manual migrate + load_destinations, replaces it). After
# the new resources are confirmed healthy: re-point the wanderes.com
# custom domain from travelagent-web to wanderes-web, re-enter the
# sync: false secrets (they don't carry over), then delete the old
# travelagent-web/travelagent-worker/travelagent-db/travelagent-redis
# resources by hand in the Render dashboard.

databases:
  - name: wanderes-db
    plan: free
    databaseName: wanderes
    user: wanderes

services:
  - type: keyvalue
    name: wanderes-redis
    plan: free
    # No public internet access needed - web/worker reach it over Render's
    # private network via the REDIS_URL envVar below, not this allow list.
    ipAllowList: []

  - type: web
    name: wanderes-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      # sync: false (not generateValue) specifically so this is prompted
      # for in the SAME Blueprint creation form as wanderes-worker's
      # copy below - generateValue fills in silently, with nothing to
      # copy from yet when the worker's prompt for the same key appears
      # right after it. Enter one long random value here and paste the
      # exact same value into the worker's DJANGO_SECRET_KEY prompt.
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: wanderes-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: wanderes-redis
          type: keyvalue
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: openai
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: CLIMATE_PROVIDER
        value: open_meteo
      # Custom domain wanderes.com now exists (2026-09-01) - production.py
      # otherwise falls back to Render's own RENDER_EXTERNAL_HOSTNAME env
      # var (set automatically), which only covers the onrender.com
      # subdomain, not a custom domain.
      - key: DJANGO_ALLOWED_HOSTS
        value: wanderes.com,www.wanderes.com
      # Google OAuth login (2026-09-03) - web service only, never the
      # worker, since OAuth only ever happens over an HTTP request/
      # redirect, something the worker process never handles. Blank until
      # entered manually here (see .env.example for where to get real
      # values) - the "Continue with Google" button stays hidden until
      # both are set (core.context_processors.site_meta).
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      # Email (2026-09-04, password reset via emailed token) - web service
      # only, never the worker, since no Celery task sends email today.
      # Blank until entered manually here (see .env.example for what's
      # needed and how it's provider-agnostic) - the "Forgot your
      # password?" link stays hidden until these are set
      # (core.context_processors.site_meta's email_configured flag).
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        value: "Wanderes <noreply@wanderes.com>"

  - type: worker
    name: wanderes-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Overrides the image's default CMD (gunicorn) - same image, different
    # process, exactly like docker-compose.yml's web/worker split.
    # --concurrency=2: without it, Celery's prefork pool defaults to one
    # process per detected CPU - it reported 16 on this plan's container,
    # each a full copy of Django/Celery in memory, which likely exceeded
    # the 512MB plan and got OOM-killed (seen as repeated "recovery"
    # restarts in the logs, and "failed" status in the dashboard). This
    # app currently has exactly one lightweight, low-volume task
    # (trips.tasks.update_traveler_preferences_from_feedback) - it does
    # not need 16-way parallelism, or even close to it.
    # -B embeds the beat scheduler in this same process (2026-09-02,
    # climate cache pre-warming - see config/settings/base.py's
    # CELERY_BEAT_SCHEDULE) rather than a separate Render service, since
    # this plan only ever runs a single worker instance - correct only as
    # long as that stays true; a second instance would double-schedule
    # the warming task. Revisit (move beat to its own service) if this
    # worker is ever scaled beyond one instance.
    dockerCommand: celery -A config worker -l info --concurrency=2 -B
    plan: 0.5c-512mb
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      # production.py fails fast if ALLOWED_HOSTS is empty (a real
      # protection against Host-header attacks) - but that check only
      # matters for a process serving HTTP requests, which this worker
      # never does (no RENDER_EXTERNAL_HOSTNAME either, since it has no
      # public URL). Any non-empty value satisfies the check; it is never
      # actually consulted by anything this process does.
      - key: DJANGO_ALLOWED_HOSTS
        value: celery-worker
      # Render's Blueprint spec has no documented way to share one
      # service's plain envVar value with another (fromService only
      # exposes connection properties like host/port/connectionString) -
      # unlike DATABASE_URL/REDIS_URL below, this can't be wired
      # automatically. Enter the exact same value typed into
      # wanderes-web's DJANGO_SECRET_KEY prompt above, so both
      # processes share one key. Currently harmless if they drift (this
      # worker never signs/verifies cookies, tokens, or sessions), but
      # keep them matched as a matter of correctness.
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: wanderes-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: wanderes-redis
          type: keyvalue
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: openai
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: CLIMATE_PROVIDER
        value: open_meteo
