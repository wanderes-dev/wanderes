{% extends "base.html" %}

{% block title %}Chat with Wander - Wanderes{% endblock %}

{% block content_class %}content-flush{% endblock %}

{% block content %}
{% csrf_token %}

<style>
    /* Fills whatever height .content-flush has left after the site
       header/footer (see static/css/main.css) - not 100vh, since the
       chat page is no longer the only thing on screen. */
    .chat-page {
        max-width: 960px;
        width: 100%;
        margin: 0 auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        flex: 1 1 auto;
        min-height: 0;
        box-sizing: border-box;
    }
    .chat-header {
        flex-shrink: 0;
    }
    .chat-messages {
        flex: 1 1 auto;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        padding: 0.5rem 0;
    }
    .chat-bubble {
        max-width: 85%;
        padding: 0.7rem 1rem;
        border-radius: var(--radius-lg);
        line-height: 1.5;
        word-wrap: break-word;
        box-shadow: var(--shadow-sm);
    }
    .chat-bubble.user {
        align-self: flex-end;
        background: var(--color-primary);
        color: #fff;
        white-space: pre-wrap;
        border-bottom-right-radius: 0.3rem;
    }
    /* Assistant replies are rendered from Markdown (see renderMarkdown() below)
       into real <p>/<table>/<ul> elements, so they don't need white-space:
       pre-wrap - these reset the browser's default block margins so spacing
       stays tight and consistent between chunks of a reply instead. */
    .chat-bubble.assistant p {
        margin: 0 0 0.6rem;
    }
    .chat-bubble.assistant p:last-child {
        margin-bottom: 0;
    }
    .chat-bubble.assistant ul,
    .chat-bubble.assistant ol {
        margin: 0 0 0.6rem;
        padding-left: 1.4rem;
    }
    .chat-bubble.assistant li {
        margin-bottom: 0.2rem;
    }
    .chat-bubble.assistant .table-scroll {
        overflow-x: auto;
        margin: 0 0 0.6rem;
    }
    .chat-bubble.assistant table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.92rem;
    }
    .chat-bubble.assistant th,
    .chat-bubble.assistant td {
        border: 1px solid var(--color-border, #dde2e7);
        padding: 0.4rem 0.6rem;
        text-align: left;
        vertical-align: top;
    }
    .chat-bubble.assistant th {
        background: rgba(0, 0, 0, 0.04);
    }
    .chat-bubble.assistant {
        align-self: flex-start;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-bottom-left-radius: 0.3rem;
    }
    .chat-bubble.error {
        align-self: flex-start;
        background: var(--color-error-bg);
        color: var(--color-error-text);
        border-bottom-left-radius: 0.3rem;
    }
    .chat-bubble.loading {
        align-self: flex-start;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        color: var(--color-text-muted);
        border-bottom-left-radius: 0.3rem;
        animation: chat-loading-pulse 1.6s ease-in-out infinite;
    }
    @keyframes chat-loading-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
    }
    .chat-form {
        flex-shrink: 0;
        display: flex;
        gap: 0.6rem;
        padding-top: 0.75rem;
    }
    .chat-form input[type="text"] {
        flex: 1 1 auto;
        padding: 0.7rem 1rem;
        font-size: 1rem;
        border-radius: var(--radius-pill);
    }
    .chat-form button {
        padding: 0.7rem 1.4rem;
        font-size: 1rem;
        flex-shrink: 0;
    }
    .chat-form button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
    }

    /* Recommendation cards - real destination data (never fabricated,
       see ai/views.py's _recommendation_card_data()), rendered as
       structured cards instead of the AI's prose alone (2026-09-01
       UX pass: "recommendations must feel like recommendations"). */
    .recommendation-cards {
        align-self: flex-start;
        max-width: 100%;
        width: 100%;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 0.75rem;
        margin-top: -0.25rem;
    }
    .recommendation-card {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        padding: 1rem 1.1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }
    .recommendation-card .destination-name {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 1.1rem;
    }
    .recommendation-card .destination-country {
        color: var(--color-text-muted);
        font-size: 0.88rem;
        margin-top: -0.35rem;
    }
    .recommendation-card .fit-reasons {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        font-size: 0.85rem;
        color: var(--color-text);
    }
    .recommendation-card .fit-reasons li::before {
        content: "✓ ";
        color: var(--color-primary);
        font-weight: 700;
    }
    .recommendation-card .btn {
        margin-top: auto;
        align-self: flex-start;
        font-size: 0.88rem;
        padding: 0.45rem 0.9rem;
    }
    @media (max-width: 480px) {
        .chat-page { padding: 0.5rem; }
        .chat-bubble { max-width: 95%; }
        .recommendation-cards { grid-template-columns: 1fr; }
    }
</style>

<div class="chat-page">
    <div class="chat-header">
        <h1>Chat with Wander</h1>
        <p>Tell me what kind of trip you're thinking about - dates, budget, climate, anything.</p>
    </div>

    <div id="chat-messages" class="chat-messages"></div>

    <form id="chat-form" class="chat-form">
        <input
            type="text"
            id="message-input"
            placeholder="e.g. Somewhere warm in October, not too expensive"
            autocomplete="off"
            aria-label="Message"
            required
        >
        <button type="submit" id="send-button">Send</button>
    </form>
</div>

<script>
(function () {
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message-input");
    const sendButton = document.getElementById("send-button");
    const messages = document.getElementById("chat-messages");
    const csrfToken = document.querySelector("[name=csrfmiddlewaretoken]").value;
    const RECOMMENDATIONS_DELIMITER = "\n<<<TRAVELAGENT_RECOMMENDATIONS>>>\n";

    function addBubble(text, className) {
        const bubble = document.createElement("div");
        bubble.className = "chat-bubble " + className;
        bubble.textContent = text;
        messages.appendChild(bubble);
        messages.scrollTop = messages.scrollHeight;
        return bubble;
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function inlineFormat(text) {
        // Only **bold** for now - the AI's own formatting stays simple by
        // design (09_AI_ORCHESTRATION.md: short, natural replies), and
        // tables/lists/bold cover everything asked for so far.
        return text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    }

    function splitTableRow(line) {
        let cells = line.split("|");
        if (cells.length && cells[0].trim() === "") cells.shift();
        if (cells.length && cells[cells.length - 1].trim() === "") cells.pop();
        return cells.map(function (cell) { return cell.trim(); });
    }

    function isTableSeparatorLine(line) {
        return /^[\s|:-]+$/.test(line) && line.indexOf("-") !== -1;
    }

    // Renders the AI's Markdown-ish replies (bold, tables, numbered/bulleted
    // lists - the formats requested directly by the user, 2026-08-31, in
    // place of walls of plain paragraphs) into real HTML. Escapes HTML
    // first so nothing in the AI's own text - even if it echoed back
    // something odd from a prior message - can inject markup; the only
    // tags ever produced come from the specific constructs parsed below.
    function renderMarkdown(text) {
        const lines = escapeHtml(text).split("\n");
        let html = "";
        let i = 0;
        while (i < lines.length) {
            const line = lines[i];

            if (line.indexOf("|") !== -1 && lines[i + 1] !== undefined && isTableSeparatorLine(lines[i + 1])) {
                const headerCells = splitTableRow(line);
                html += "<div class=\"table-scroll\"><table><thead><tr>";
                headerCells.forEach(function (cell) {
                    html += "<th>" + inlineFormat(cell) + "</th>";
                });
                html += "</tr></thead><tbody>";
                i += 2;
                while (i < lines.length && lines[i].indexOf("|") !== -1) {
                    const cells = splitTableRow(lines[i]);
                    html += "<tr>";
                    cells.forEach(function (cell) {
                        html += "<td>" + inlineFormat(cell) + "</td>";
                    });
                    html += "</tr>";
                    i++;
                }
                html += "</tbody></table></div>";
                continue;
            }

            const orderedMatch = /^\d+\.\s+(.*)$/.exec(line);
            const bulletMatch = /^[-*]\s+(.*)$/.exec(line);
            if (orderedMatch || bulletMatch) {
                const tag = orderedMatch ? "ol" : "ul";
                html += "<" + tag + ">";
                while (i < lines.length) {
                    const om = /^\d+\.\s+(.*)$/.exec(lines[i]);
                    const bm = /^[-*]\s+(.*)$/.exec(lines[i]);
                    const itemText = orderedMatch ? (om && om[1]) : (bm && bm[1]);
                    if (itemText === undefined || itemText === null) break;
                    html += "<li>" + inlineFormat(itemText) + "</li>";
                    i++;
                }
                html += "</" + tag + ">";
                continue;
            }

            if (line.trim() === "") {
                i++;
                continue;
            }

            html += "<p>" + inlineFormat(line) + "</p>";
            i++;
        }
        return html;
    }

    function setLoading(isLoading) {
        input.disabled = isLoading;
        sendButton.disabled = isLoading;
    }

    // Contextual loading copy instead of a generic "thinking..." spinner
    // (2026-09-01 UX pass, direct request) - picked at random each send so
    // it doesn't feel like a fixed, repeated label.
    const LOADING_MESSAGES = [
        "Finding destinations that fit your preferences...",
        "Thinking about the best options for your trip...",
        "Comparing possibilities...",
        "Looking at climate and costs for you...",
    ];

    function randomLoadingMessage() {
        return LOADING_MESSAGES[Math.floor(Math.random() * LOADING_MESSAGES.length)];
    }

    function addRecommendationCards(destinations) {
        if (!destinations || !destinations.length) {
            return;
        }
        const container = document.createElement("div");
        container.className = "recommendation-cards";
        destinations.forEach(function (destination) {
            const card = document.createElement("div");
            card.className = "recommendation-card";

            const name = document.createElement("div");
            name.className = "destination-name";
            name.textContent = destination.name;
            card.appendChild(name);

            const country = document.createElement("div");
            country.className = "destination-country";
            country.textContent = destination.country;
            card.appendChild(country);

            const tagGroup = document.createElement("div");
            tagGroup.className = "tag-group";
            if (destination.trip_type) {
                const tag = document.createElement("span");
                tag.className = "tag";
                tag.textContent = destination.trip_type;
                tagGroup.appendChild(tag);
            }
            if (destination.cost_of_living) {
                const tag = document.createElement("span");
                tag.className = "tag tag-accent";
                tag.textContent = destination.cost_of_living;
                tagGroup.appendChild(tag);
            }
            if (typeof destination.avg_high_c === "number") {
                const tag = document.createElement("span");
                tag.className = "tag";
                tag.textContent = Math.round(destination.avg_high_c) + "°C avg";
                tagGroup.appendChild(tag);
            }
            if (tagGroup.children.length) {
                card.appendChild(tagGroup);
            }

            if (destination.fit_reasons && destination.fit_reasons.length) {
                const list = document.createElement("ul");
                list.className = "fit-reasons";
                destination.fit_reasons.forEach(function (reason) {
                    const item = document.createElement("li");
                    item.textContent = reason;
                    list.appendChild(item);
                });
                card.appendChild(list);
            }

            const link = document.createElement("a");
            link.className = "btn btn-secondary";
            link.href = "/trips/create/?destination=" + encodeURIComponent(destination.slug);
            link.textContent = "Save this trip";
            card.appendChild(link);

            container.appendChild(card);
        });
        messages.appendChild(container);
        messages.scrollTop = messages.scrollHeight;
    }

    async function sendMessage(message) {
        addBubble(message, "user");
        const loadingBubble = addBubble(randomLoadingMessage(), "loading");
        setLoading(true);

        let response;
        try {
            response = await fetch("{% url 'ai:recommendations-api' %}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded",
                    "X-CSRFToken": csrfToken,
                },
                body: "message=" + encodeURIComponent(message),
            });
        } catch (networkError) {
            loadingBubble.remove();
            addBubble("Couldn't reach the server. Check your connection and try again.", "error");
            setLoading(false);
            return;
        }

        if (!response.ok || !response.body) {
            loadingBubble.remove();
            addBubble("Something went wrong on our end. Please try again.", "error");
            setLoading(false);
            return;
        }

        loadingBubble.remove();
        const replyBubble = addBubble("", "assistant");
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        function render() {
            const delimiterIndex = buffer.indexOf(RECOMMENDATIONS_DELIMITER);
            const visibleText = delimiterIndex === -1 ? buffer : buffer.slice(0, delimiterIndex);
            replyBubble.innerHTML = renderMarkdown(visibleText);
            messages.scrollTop = messages.scrollHeight;
        }

        try {
            while (true) {
                const { done, value } = await reader.read();
                if (done) {
                    break;
                }
                buffer += decoder.decode(value, { stream: true });
                render();
            }
        } catch (streamError) {
            buffer += "\n[Connection interrupted]";
            render();
        }

        const delimiterIndex = buffer.indexOf(RECOMMENDATIONS_DELIMITER);
        if (delimiterIndex !== -1) {
            const jsonText = buffer.slice(delimiterIndex + RECOMMENDATIONS_DELIMITER.length);
            try {
                addRecommendationCards(JSON.parse(jsonText));
            } catch (parseError) {
                // No usable recommendations footer - not an error the user needs to see.
            }
        }

        setLoading(false);
        input.focus();
    }

    form.addEventListener("submit", function (event) {
        event.preventDefault();
        const message = input.value.trim();
        if (!message) {
            return;
        }
        input.value = "";
        sendMessage(message);
    });
})();
</script>
{% endblock %}
