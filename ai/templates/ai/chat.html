{% extends "base.html" %}

{% block title %}Chat with Wander - TravelAgent{% endblock %}

{% block content_class %}content-flush{% endblock %}

{% block content %}
{% csrf_token %}

<style>
    /* Fills whatever height .content-flush has left after the site
       header/footer (see static/css/main.css) - not 100vh, since the
       chat page is no longer the only thing on screen. */
    .chat-page {
        max-width: 960px;
        width: 100%;
        margin: 0 auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        flex: 1 1 auto;
        min-height: 0;
        box-sizing: border-box;
    }
    .chat-header {
        flex-shrink: 0;
    }
    .chat-messages {
        flex: 1 1 auto;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        padding: 0.5rem 0;
    }
    .chat-bubble {
        max-width: 85%;
        padding: 0.6rem 0.9rem;
        border-radius: 0.75rem;
        line-height: 1.4;
        word-wrap: break-word;
    }
    .chat-bubble.user {
        align-self: flex-end;
        background: #d6e4ff;
        white-space: pre-wrap;
    }
    /* Assistant replies are rendered from Markdown (see renderMarkdown() below)
       into real <p>/<table>/<ul> elements, so they don't need white-space:
       pre-wrap - these reset the browser's default block margins so spacing
       stays tight and consistent between chunks of a reply instead. */
    .chat-bubble.assistant p {
        margin: 0 0 0.6rem;
    }
    .chat-bubble.assistant p:last-child {
        margin-bottom: 0;
    }
    .chat-bubble.assistant ul,
    .chat-bubble.assistant ol {
        margin: 0 0 0.6rem;
        padding-left: 1.4rem;
    }
    .chat-bubble.assistant li {
        margin-bottom: 0.2rem;
    }
    .chat-bubble.assistant .table-scroll {
        overflow-x: auto;
        margin: 0 0 0.6rem;
    }
    .chat-bubble.assistant table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.92rem;
    }
    .chat-bubble.assistant th,
    .chat-bubble.assistant td {
        border: 1px solid var(--color-border, #dde2e7);
        padding: 0.4rem 0.6rem;
        text-align: left;
        vertical-align: top;
    }
    .chat-bubble.assistant th {
        background: rgba(0, 0, 0, 0.04);
    }
    .chat-bubble.assistant {
        align-self: flex-start;
        background: #f0f0f0;
    }
    .chat-bubble.error {
        align-self: flex-start;
        background: #ffe0e0;
        color: #900;
    }
    .chat-bubble.loading {
        align-self: flex-start;
        background: #f0f0f0;
        color: #666;
        font-style: italic;
    }
    .chat-form {
        flex-shrink: 0;
        display: flex;
        gap: 0.5rem;
        padding-top: 0.5rem;
    }
    .chat-form input[type="text"] {
        flex: 1 1 auto;
        padding: 0.6rem;
        font-size: 1rem;
    }
    .chat-form button {
        padding: 0.6rem 1rem;
        font-size: 1rem;
    }
    .save-trip-links {
        align-self: flex-start;
        max-width: 85%;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        margin-top: -0.5rem;
    }
    .save-trip-links a {
        font-size: 0.9rem;
    }
    @media (max-width: 480px) {
        .chat-page { padding: 0.5rem; }
        .chat-bubble { max-width: 95%; }
    }
</style>

<div class="chat-page">
    <div class="chat-header">
        <h1>Chat with Wander</h1>
        <p>Tell me what kind of trip you're thinking about - dates, budget, climate, anything.</p>
    </div>

    <div id="chat-messages" class="chat-messages"></div>

    <form id="chat-form" class="chat-form">
        <input
            type="text"
            id="message-input"
            placeholder="e.g. Somewhere warm in October, not too expensive"
            autocomplete="off"
            required
        >
        <button type="submit" id="send-button">Send</button>
    </form>
</div>

<script>
(function () {
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message-input");
    const sendButton = document.getElementById("send-button");
    const messages = document.getElementById("chat-messages");
    const csrfToken = document.querySelector("[name=csrfmiddlewaretoken]").value;
    const RECOMMENDATIONS_DELIMITER = "\n<<<TRAVELAGENT_RECOMMENDATIONS>>>\n";

    function addBubble(text, className) {
        const bubble = document.createElement("div");
        bubble.className = "chat-bubble " + className;
        bubble.textContent = text;
        messages.appendChild(bubble);
        messages.scrollTop = messages.scrollHeight;
        return bubble;
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function inlineFormat(text) {
        // Only **bold** for now - the AI's own formatting stays simple by
        // design (09_AI_ORCHESTRATION.md: short, natural replies), and
        // tables/lists/bold cover everything asked for so far.
        return text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    }

    function splitTableRow(line) {
        let cells = line.split("|");
        if (cells.length && cells[0].trim() === "") cells.shift();
        if (cells.length && cells[cells.length - 1].trim() === "") cells.pop();
        return cells.map(function (cell) { return cell.trim(); });
    }

    function isTableSeparatorLine(line) {
        return /^[\s|:-]+$/.test(line) && line.indexOf("-") !== -1;
    }

    // Renders the AI's Markdown-ish replies (bold, tables, numbered/bulleted
    // lists - the formats requested directly by the user, 2026-08-31, in
    // place of walls of plain paragraphs) into real HTML. Escapes HTML
    // first so nothing in the AI's own text - even if it echoed back
    // something odd from a prior message - can inject markup; the only
    // tags ever produced come from the specific constructs parsed below.
    function renderMarkdown(text) {
        const lines = escapeHtml(text).split("\n");
        let html = "";
        let i = 0;
        while (i < lines.length) {
            const line = lines[i];

            if (line.indexOf("|") !== -1 && lines[i + 1] !== undefined && isTableSeparatorLine(lines[i + 1])) {
                const headerCells = splitTableRow(line);
                html += "<div class=\"table-scroll\"><table><thead><tr>";
                headerCells.forEach(function (cell) {
                    html += "<th>" + inlineFormat(cell) + "</th>";
                });
                html += "</tr></thead><tbody>";
                i += 2;
                while (i < lines.length && lines[i].indexOf("|") !== -1) {
                    const cells = splitTableRow(lines[i]);
                    html += "<tr>";
                    cells.forEach(function (cell) {
                        html += "<td>" + inlineFormat(cell) + "</td>";
                    });
                    html += "</tr>";
                    i++;
                }
                html += "</tbody></table></div>";
                continue;
            }

            const orderedMatch = /^\d+\.\s+(.*)$/.exec(line);
            const bulletMatch = /^[-*]\s+(.*)$/.exec(line);
            if (orderedMatch || bulletMatch) {
                const tag = orderedMatch ? "ol" : "ul";
                html += "<" + tag + ">";
                while (i < lines.length) {
                    const om = /^\d+\.\s+(.*)$/.exec(lines[i]);
                    const bm = /^[-*]\s+(.*)$/.exec(lines[i]);
                    const itemText = orderedMatch ? (om && om[1]) : (bm && bm[1]);
                    if (itemText === undefined || itemText === null) break;
                    html += "<li>" + inlineFormat(itemText) + "</li>";
                    i++;
                }
                html += "</" + tag + ">";
                continue;
            }

            if (line.trim() === "") {
                i++;
                continue;
            }

            html += "<p>" + inlineFormat(line) + "</p>";
            i++;
        }
        return html;
    }

    function setLoading(isLoading) {
        input.disabled = isLoading;
        sendButton.disabled = isLoading;
    }

    function addSaveTripLinks(destinations) {
        if (!destinations || !destinations.length) {
            return;
        }
        const container = document.createElement("div");
        container.className = "save-trip-links";
        destinations.forEach(function (destination) {
            const link = document.createElement("a");
            link.href = "/trips/create/?destination=" + encodeURIComponent(destination.slug);
            link.textContent = "Save " + destination.name + " as a trip";
            container.appendChild(link);
        });
        messages.appendChild(container);
        messages.scrollTop = messages.scrollHeight;
    }

    async function sendMessage(message) {
        addBubble(message, "user");
        const loadingBubble = addBubble("TravelAgent is thinking...", "loading");
        setLoading(true);

        let response;
        try {
            response = await fetch("{% url 'ai:recommendations-api' %}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded",
                    "X-CSRFToken": csrfToken,
                },
                body: "message=" + encodeURIComponent(message),
            });
        } catch (networkError) {
            loadingBubble.remove();
            addBubble("Couldn't reach the server. Check your connection and try again.", "error");
            setLoading(false);
            return;
        }

        if (!response.ok || !response.body) {
            loadingBubble.remove();
            addBubble("Something went wrong on our end. Please try again.", "error");
            setLoading(false);
            return;
        }

        loadingBubble.remove();
        const replyBubble = addBubble("", "assistant");
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        function render() {
            const delimiterIndex = buffer.indexOf(RECOMMENDATIONS_DELIMITER);
            const visibleText = delimiterIndex === -1 ? buffer : buffer.slice(0, delimiterIndex);
            replyBubble.innerHTML = renderMarkdown(visibleText);
            messages.scrollTop = messages.scrollHeight;
        }

        try {
            while (true) {
                const { done, value } = await reader.read();
                if (done) {
                    break;
                }
                buffer += decoder.decode(value, { stream: true });
                render();
            }
        } catch (streamError) {
            buffer += "\n[Connection interrupted]";
            render();
        }

        const delimiterIndex = buffer.indexOf(RECOMMENDATIONS_DELIMITER);
        if (delimiterIndex !== -1) {
            const jsonText = buffer.slice(delimiterIndex + RECOMMENDATIONS_DELIMITER.length);
            try {
                addSaveTripLinks(JSON.parse(jsonText));
            } catch (parseError) {
                // No usable recommendations footer - not an error the user needs to see.
            }
        }

        setLoading(false);
        input.focus();
    }

    form.addEventListener("submit", function (event) {
        event.preventDefault();
        const message = input.value.trim();
        if (!message) {
            return;
        }
        input.value = "";
        sendMessage(message);
    });
})();
</script>
{% endblock %}
