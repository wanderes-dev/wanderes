{% extends "base.html" %}

{% block title %}My account - TravelAgent{% endblock %}

{% block content %}
<h1>My account</h1>
<p>Email: {{ user.email }}</p>
<p>Member since: {{ user.date_joined|date:"Y-m-d" }}</p>
<form method="post" action="{% url 'users:logout' %}">
    {% csrf_token %}
    <button type="submit">Log out</button>
</form>
{% endblock %}
