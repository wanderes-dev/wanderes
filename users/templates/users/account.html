{% extends "base.html" %}

{% block title %}My account - TravelAgent{% endblock %}

{% block content %}
<h1>My account</h1>
<div class="card">
    <p>Email: {{ user.email }}</p>
    <p>Member since: {{ user.date_joined|date:"Y-m-d" }}</p>
</div>

<ul class="item-list">
    <li><a href="{% url 'users:profile' %}">Edit my traveler profile</a></li>
    <li><a href="{% url 'trips:history-list' %}">My travel history</a></li>
    <li><a href="{% url 'trips:trip-list' %}">My trips</a></li>
</ul>

<form method="post" action="{% url 'users:logout' %}" class="actions">
    {% csrf_token %}
    <button type="submit" class="btn btn-secondary">Log out</button>
</form>
{% endblock %}
