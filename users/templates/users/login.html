{% extends "base.html" %}
{% load i18n %}

{% block title %}Log in - TravelAgent{% endblock %}

{% block content %}
<h1>Log in</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Log in</button>
</form>
<p><a href="{% url 'users:register' %}">Create an account</a></p>
{% endblock %}
