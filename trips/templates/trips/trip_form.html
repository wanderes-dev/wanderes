{% extends "base.html" %}

{% block title %}{% if is_edit %}Edit{% else %}Create{% endif %} trip - TravelAgent{% endblock %}

{% block content %}
<h1>{% if is_edit %}Edit trip{% else %}Create a trip{% endif %}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Save</button>
</form>
<p><a href="{% url 'trips:trip-list' %}">Back to my trips</a></p>
{% endblock %}
