{% extends "base.html" %}

{% block title %}Delete trip - TravelAgent{% endblock %}

{% block content %}
<h1>Delete this trip?</h1>
<p>{{ trip.name|default:trip.destination.name }} - {{ trip.destination.name }}, {{ trip.destination.country }}</p>
<form method="post" class="actions">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'trips:trip-detail' trip.pk %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
